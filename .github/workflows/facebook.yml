name: Facebook autopilot

on:
  # schedule disabled — module shelved at owner request (2026-10-04); re-enable anytime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facebook-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post next queue entry
        run: python fb.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

      - name: Commit updated queue state
        run: |
          git config user.name "autopilot-bot"
          git config user.email "actions@github.com"
          git add fb.json
          if git diff --staged --quiet; then
            echo "No state change (dry-run or empty queue)."
          else
            git commit -m "facebook: mark entry posted"
            git push
          fi
